name: nodulo

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nodulo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nodulo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  db-migrate:
    build:
      context: ./core-nodulo
      dockerfile: Dockerfile
      args:
        MAIN_PACKAGE: ./cmd/migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nodulo}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-nodulo}?sslmode=disable
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-storage-init:
    image: alpine:latest
    command: ["sh", "-c", "mkdir -p /data/nodulo/ingestion && chown 10001:10001 /data/nodulo/ingestion && chmod 0700 /data/nodulo/ingestion"]
    volumes:
      - ingestiondata:/data/nodulo/ingestion
    restart: "no"

  api:
    build:
      context: ./core-nodulo
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:?Defina INFERENCE_BASE_URL no arquivo .env}
      GENERATION_MODEL: ${GENERATION_MODEL:?Defina GENERATION_MODEL no arquivo .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?Defina EMBEDDING_MODEL no arquivo .env}
      VISION_MODEL: ${VISION_MODEL:-}
      NODULO_PYTHON_SANDBOX_IMAGE: ${NODULO_PYTHON_SANDBOX_IMAGE:-nodulo-python-sandbox:1.0}
      PYTHON_EXECUTOR_URL: ${PYTHON_EXECUTOR_URL:-}
      PYTHON_EXECUTOR_TOKEN: ${PYTHON_EXECUTOR_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-nodulo}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-nodulo}?sslmode=disable
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      INGESTION_STORAGE_DIR: /data/nodulo/ingestion
    volumes:
      - ingestiondata:/data/nodulo/ingestion
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      ingestion-storage-init:
        condition: service_completed_successfully

  sandbox-image-build:
    profiles: ["python"]
    image: nodulo-python-sandbox:1.0
    build:
      context: ./core-nodulo
      dockerfile: Dockerfile.python-sandbox
    entrypoint: ["python", "-c"]
    command: ["import numpy, matplotlib; print('sandbox image ready')"]
    restart: "no"

  python-executor:
    profiles: ["python"]
    image: nodulo-python-executor:1.0
    build:
      context: ./core-nodulo
      dockerfile: Dockerfile.python-executor
    environment:
      PYTHON_EXECUTOR_ADDR: ":8080"
      PYTHON_EXECUTOR_TOKEN: ${PYTHON_EXECUTOR_TOKEN:-}
      PYTHON_EXECUTOR_CONCURRENCY: ${PYTHON_EXECUTOR_CONCURRENCY:-2}
      NODULO_PYTHON_SANDBOX_IMAGE: nodulo-python-sandbox:1.0
    group_add:
      - ${DOCKER_GID:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-image-build:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ./web-nodulo
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081/api/chat}
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  postgres-backup:
    profiles: ["backup"]
    image: postgres:16-alpine
    restart: unless-stopped
    user: "0:0"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-nodulo}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-nodulo}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - postgresbackups:/backups
      - ./deploy/postgres-backup.sh:/scripts/postgres-backup.sh:ro
    entrypoint: ["/bin/sh", "/scripts/postgres-backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  seed-admin:
    profiles: ["setup"]
    build:
      context: ./core-nodulo
      dockerfile: Dockerfile
      args:
        MAIN_PACKAGE: ./cmd/seed-admin
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nodulo}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-nodulo}?sslmode=disable
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

volumes:
  pgdata:
  ingestiondata:
  postgresbackups:
